name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - run: npm run test:ci

  local-only:
    # Runs the real preview/PDF/PlantUML pipeline behind a recording proxy and
    # fails if anything tries to leave the machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:local-only
