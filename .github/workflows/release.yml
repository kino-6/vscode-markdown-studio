name: Release VSIX

on:
  push:
    tags:
      - 'v*'
  # Rehearsal: a PR that changes this workflow runs every step except the
  # GitHub Release itself, so release changes are tested before a real tag.
  pull_request:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Java and Chromium are needed by the local-only check (PlantUML, PDF).
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Full checks. Any failure stops the job before a VSIX exists.
      - run: npm run lint

      - run: npm run test:unit

      - run: npm run test:integration

      - run: npm run test:local-only

      # Uses the vsce pinned in package.json.
      - run: npm run package

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true
